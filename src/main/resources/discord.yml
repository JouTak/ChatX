enabled: false
token: ""
guild-id: ""
ignore-bots: true

# GLOBAL is the shared mc-live route. LOCAL routes are matched by Velocity backend ID.
routes: []
#  - type: GLOBAL
#    destination-id: ""
#    webhook-url: ""
#    thread-id: ""
#  - type: LOCAL
#    backend: "survival"
#    destination-id: ""
#    webhook-url: ""
