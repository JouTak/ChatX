formats:
  chat: "**{name}**: {message}"
  reply: "**{name}** replied to **{reply-name}**: {message}"
  attachments: "{url}"
  join: "{name} joined the network on {server}"
  leave: "{name} left the network from {server}"
  server-join: "{name} joined {server}"
  server-leave: "{name} left {server}"
  switch: "{name} moved from {previous-server} to {server}"
  start: "✅ Network started"
  stop: "🛑 Network stopped"
  presence: "{online} players online"

colors:
  join: "#57F287"
  leave: "#ED4245"
  switch: "#5865F2"

avatar-url: "https://mc-heads.net/avatar/{uuid}/64"
default-nickname-color: "#47BFFB"

events:
  join: true
  leave: true
  switch: false
  start: true
  stop: true
