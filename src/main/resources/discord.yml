enabled: false
token: ""
guild-id: ""
ignore-bots: true

# GLOBAL is the shared mc-live route. LOCAL routes are matched by Velocity backend ID.
routes: []
#  - type: GLOBAL
#    destination-id: ""
#    webhook-url: ""
#    thread-id: ""
#  - type: LOCAL
#    backend: "survival"
#    destination-id: ""
#    webhook-url: ""
#    thread-id: ""

formats:
  chat: "**{name}**: {message}"
  reply: "**{name}** replied to **{reply-name}**: {message}"
  attachments: "{url}"
  join: "{name} joined the network on {server}"
  leave: "{name} left the network from {server}"
  server-join: "{name} joined {server}"
  server-leave: "{name} left {server}"
  switch: "{name} moved from {previous-server} to {server}"
  start: "✅ Network started"
  stop: "🛑 Network stopped"
  presence: "{online} players online"

colors:
  join: "#57F287"
  leave: "#ED4245"
  switch: "#5865F2"

avatar-url: "https://mc-heads.net/avatar/{uuid}/64"
default-nickname-color: "#47BFFB"

# Outbound Discord work is isolated from Minecraft chat by a bounded queue.
delivery:
  queue-capacity: 256
  max-in-flight: 16
  error-log-interval-seconds: 60

player-list-command:
  enabled: true
  trigger: "пинг"
  # Applied independently to the invoking user and the destination channel.
  cooldown-seconds: 1
  # Set to 0 to keep responses.
  delete-after-seconds: 30
  formats:
    # Available placeholders: {count}, plus {name} for player and {hidden} for truncated.
    header: "**Игроки онлайн: {count}**"
    player: "- {name}"
    empty: "Сейчас никто не играет."
    truncated: "… и ещё {hidden}"
  image:
    # text keeps the original command output; image renders a Minecraft-style TAB.
    mode: image
    max-players: 80
    show-heads: true
    show-ping: true
    use-tab: true
    network-name: "JouTak"
    # Both {key} and %key% forms are accepted. Header/footer: route_name, route,
    # backend, server_id, server, count, online, server_online, network_online,
    # shown, hidden, max and online_<backend-id> for every Velocity server.
    # Row fields additionally: name/player/player_name, display_name/tab_name/tabname,
    # prefix/tabprefix, suffix/tabsuffix, group, sort_key, ping/player_ping,
    # uuid, world/player_world and each player's own backend/server/server_online.
    # World/group/TAB styling
    # need TAB on Velocity; world needs TAB Bridge on the backend.
    # Arbitrary TAB/PAPI placeholders and viewer-specific layouts are not read.
    header: "&b{route_name} &7• &f{count} онлайн"
    footer: "&7Показано {shown} из {count} &8• &7В сети {network_online}"
    name-format: "{prefix}{display_name}{suffix}"
    ping-format: "{ping} ms"
    # Empty = use the text list from formats above if image delivery fails.
    text-fallback: ""
    render-queue-capacity: 8
    render-timeout-seconds: 8

events:
  join: true
  leave: true
  switch: false
  start: true
  stop: true
