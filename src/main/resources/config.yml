# Server group name displayed in cross-server channels. Must be unique.
# If you wish to use redis, YOU MUST CHANGE THIS TO SOMETHING ELSE
server-name: "Velocity"

# Branding shown by /chatx. The version is read automatically from the installed plugin.
branding:
  name: "ChatXJT"
  authors:
    - "EnderDissa"

lang: "en-US"

database:
  type: "sqlite" # SQLITE / MYSQL

  database: "minecraft"
  host: "0.0.0.0"
  port: 3306

  username: ""
  password: ""

redis:
  enabled: false
  address: "0.0.0.0"
  port:  6379
#  user: "admin"
#  password: "123456"

message: # /msg
  format-inbound: '<#47BFFB>%name% &8→ <#47BFFB>You&8: '
  format-outbound: '<#47BFFB>You &8→ <#47BFFB>%name%&8: '
  format-third-party: '<#47BFFB>%sender% &8→ <#47BFFB>%receiver%&8: '
  log-console: true
  message-command:
    - msg
  reply-command:
    - reply
    - r

online-command: # Requires proxy restart
  enabled: true
  command: "online" # /online

module:
  mention:
    bossbar-progress-decrease: 0.05 # 0-1, generally 0.05 is sufficient
    sound-effect-id: "minecraft:entity.experience_orb.pickup"
    sound-effect-volume: 1 # 0-1
    sound-effect-pitch: 1 # 0.5-2

debug: false # Do not turn on unless instructed

# Custom no-data particle types supplied by modded backends. Requires proxy restart.
packetevents:
  custom-particle-types:
    - "spectrum:firefly"

servers:
  mod: "ITMOcraft Modex"
  # mod -> ITMOcraft Modex
